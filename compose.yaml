services:
  node1:
    build: ./server
    ports:
      - "3001:3001"
    environment:
      FILES_DIR: /app/dummy-files
      NODE_ID: node-1
    volumes:
      - ./dummy-files:/app/dummy-files:ro
  node2:
    build: ./server
    ports:
      - "3002:3001"
    environment:
      FILES_DIR: /app/dummy-files
      NODE_ID: node-2
    volumes:
      - ./dummy-files:/app/dummy-files:ro
  node3:
    build: ./server
    ports:
      - "3003:3001"
    environment:
      FILES_DIR: /app/dummy-files
      NODE_ID: node-3
    volumes:
      - ./dummy-files:/app/dummy-files:ro
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - node1
      - node2
      - node3