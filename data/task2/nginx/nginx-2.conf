worker_processes auto;
pid /tmp/dabd-nginx-2.pid;
error_log /tmp/dabd-nginx-2-error.log warn;
events { worker_connections 4096; }
http {
  client_body_temp_path /tmp/dabd-nginx/body;
  proxy_temp_path /tmp/dabd-nginx/proxy;
  access_log /tmp/dabd-nginx/access-2.log;
  upstream app_servers {
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
  }
  server {
    listen 8080;
    proxy_read_timeout 60s;
    location / { proxy_pass http://app_servers; }
  }
}
