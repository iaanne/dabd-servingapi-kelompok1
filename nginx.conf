worker_processes auto;

events {
    worker_connections 8192;
}

http {
    upstream backend {
        server node1:3001;
        server node2:3001;
        server node3:3001;
        keepalive 100;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
